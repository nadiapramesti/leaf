name: leaf
description: Pembaca buku PDF dengan efek balik halaman, sticky note, tab, stylus, dan ubah tulisan jadi teks.
publish_to: "none"
version: 1.3.0+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  pdfx: ^2.9.0
  file_picker: ^8.1.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  google_fonts: ^6.2.1
  google_mlkit_digital_ink_recognition: ">=0.11.0 <1.0.0"
  wakelock_plus: ">=1.2.0 <2.0.0"
  syncfusion_flutter_pdf: ">=26.1.35 <99.0.0"
  google_mlkit_text_recognition: ">=0.11.0 <1.0.0"
  receive_sharing_intent: ">=1.8.0 <2.0.0"
  flutter_tts: ">=4.0.0 <5.0.0"
  url_launcher: ^6.3.0
  http: ">=1.2.0 <2.0.0"

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
