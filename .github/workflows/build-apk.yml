name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # folder android/ dibuat otomatis, lalu diisi nama, ikon, splash, izin
      - name: Siapkan folder android
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.nadiapramesti --project-name leaf _scaffold
            cp -r _scaffold/android ./android
            rm -rf _scaffold
          fi
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Leaf"/' $M
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          R=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp assets/icon/ic_launcher_$d.png $R/mipmap-$d/ic_launcher.png
          done
          for f in $R/drawable/launch_background.xml $R/drawable-v21/launch_background.xml; do
            [ -f "$f" ] && printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
              '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">' \
              '  <item><shape><solid android:color="#FF123A25"/></shape></item>' \
              '</layer-list>' > "$f"
          done
          # paksa semua plugin compile pakai Android SDK 36 (plugin lama masih 34)
          if [ -f android/build.gradle.kts ]; then
            G=android/build.gradle.kts
            printf '%s\n' 'subprojects {' \
              '    afterEvaluate {' \
              '        (extensions.findByName("android") as? com.android.build.api.dsl.LibraryExtension)?.let {' \
              '            if ((it.compileSdk ?: 0) < 36) it.compileSdk = 36' \
              '        }' \
              '    }' \
              '}' > /tmp/fix.gradle
          else
            G=android/build.gradle
            printf '%s\n' 'subprojects {' \
              '    afterEvaluate { p ->' \
              '        if (p.plugins.hasPlugin("com.android.library")) {' \
              '            p.android { compileSdkVersion 36 }' \
              '        }' \
              '    }' \
              '}' > /tmp/fix.gradle
          fi
          grep -q 'compileSdk = 36\|compileSdkVersion 36' $G || { cat /tmp/fix.gradle $G > /tmp/g && mv /tmp/g $G; }
          cat $G
          cat $M

      - run: flutter pub get

      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1 || true
          cat analyze.log
          if grep -q " error " analyze.log; then
            msg=$(grep " error " analyze.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=analyze::$msg"
          fi

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee build.log

      - name: Kirim error build ke annotations
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          msg=$(grep -iE "error|what went wrong|exception|failed|> " build.log | grep -v "^\s*$" | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=build::$msg"
          tail -40 build.log | sed ':a;N;$!ba;s/\n/%0A/g' | xargs -0 -I{} echo "::error title=tail::{}"

      - name: Rename APK
        run: |
          ls -la build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Leaf.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Leaf-hp-lama-32bit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Leaf-apk
          path: Leaf*.apk

      - name: Buat Release biar gampang diunduh dari HP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" Leaf.apk Leaf-hp-lama-32bit.apk \
            --title "Leaf build ${{ github.run_number }}" \
            --notes "Install Leaf.apk (HP 64-bit, hampir semua HP sekarang). Leaf-hp-lama-32bit.apk cuma buat HP lama. Commit ${{ github.sha }}"
