name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # folder android/ dibuat otomatis kalau belum ada di repo
      - name: Siapkan folder android
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.nadiapramesti --project-name leaf _scaffold
            cp -r _scaffold/android ./android
            rm -rf _scaffold
          fi
          sed -i 's/android:label="[^"]*"/android:label="Leaf"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Leaf.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Leaf-apk
          path: Leaf.apk

      - name: Buat Release biar gampang diunduh dari HP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" Leaf.apk \
            --title "Leaf build ${{ github.run_number }}" \
            --notes "APK otomatis dari commit ${{ github.sha }}"
